name: Refresh B2B snapshot
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch, validate, aggregate
        env:
          MEDWAY_B2B_TOKEN: ${{ secrets.MEDWAY_B2B_TOKEN }}
        run: |
          test -n "$MEDWAY_B2B_TOKEN"
          python3 pipeline.py --b2b-only
          python3 -m unittest discover -s tests -v
          node --test tests/test_api.cjs tests/test_filter.cjs tests/test_insights.cjs
          node --check public/app.js
          node --check public/insights.js
      - name: Commit only verified public aggregate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/b2b-snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh B2B aggregate snapshot'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
